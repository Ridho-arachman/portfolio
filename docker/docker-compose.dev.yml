services:
  nextjs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev  # <--- PANGGIL DOCKERFILE DEV
    container_name: nextjs_dev
    volumes:
      - ..:/app              # Mount root project
      - /app/node_modules       # Agar node_modules host tidak menimpa container
      - /app/.next              # Agar folder .next host tidak menimpa container
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true  # Wajib agar HMR terdeteksi di Docker
      - DATABASE_URL=postgresql://devuser:devpassword@host.docker.internal:5432/devdb?schema=public
    extra_hosts:
      - "host.docker.internal:host-gateway" # ⬇️ WAJIB agar bisa connect ke host (terutama di Linux)
    ports:
      - "3000:3000"             # Akses langsung ke Next.js untuk HMR terbaik
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_dev
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    networks:
      - app_network

networks:
  app_network:
    driver: bridge