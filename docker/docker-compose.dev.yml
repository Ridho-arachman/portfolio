services:
  nextjs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev  # <--- PANGGIL DOCKERFILE DEV
    container_name: nextjs_dev
    volumes:
      - ..:/app:cached           # Mount root project
      - /app/node_modules       # Agar node_modules host tidak menimpa container
      - /app/.next              # Agar folder .next host tidak menimpa container
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/portfolio_test
      - BETTER_AUTH_SECRET=dev-secret-change-me
      - BETTER_AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway" # ⬇️ WAJIB agar bisa connect ke host (terutama di Linux)
    ports:
      - "3000:3000"             # Akses langsung ke Next.js untuk HMR terbaik
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_dev
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    networks:
      - app_network

networks:
  app_network:
    driver: bridge