services:
  nextjs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod # <--- PANGGIL DOCKERFILE PROD
    container_name: nextjs_prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:korekapi123@db.wdllwnwyiwyhndodbkur.supabase.co:5432/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    networks:
      - app_network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=GANTI_DENGAN_AUTH_TOKEN_ANDA
    command: "http nginx:80"
    ports:
      - "4040:4040"
    depends_on:
      - nginx
    networks:
      - app_network

networks:
  app_network:
    driver: bridge