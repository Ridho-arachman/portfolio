name: CI/CD Pipeline

on:
  push:
    branches: ["main"] # Deploy otomatis hanya saat push ke main
  pull_request:
    branches: ["main", "develop"] # Hanya test saat PR

# Mencegah pipeline menumpuk jika ada push berturut-turut
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # TAHAP 1: CI (Continuous Integration) - Validasi Kode
  # =========================================================
  ci-test:
    name: Lint, Typecheck, Build & Docker Test
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Run Linter
        run: npm run lint

      - name: 🧠 Type Checking
        run: npx tsc --noEmit

      - name: 🏗️ Build Next.js App
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          # Tambahkan variabel lain jika project Anda membutuhkannya saat build
        run: npm run build

      - name: 🐳 Test Docker Build (PENTING!)
        # Memastikan Dockerfile.prod Anda 100% valid sebelum masuk ke server
        run: |
          echo "Membangun image Docker untuk validasi..."
          docker build -f docker/Dockerfile.prod -t nextjs-app:ci-test .
          echo "✅ Docker build berhasil! File .dockerignore dan Dockerfile aman."

  # =========================================================
  # TAHAP 2: CD (Continuous Deployment) - Deploy ke Server
  # =========================================================
  deploy:
    name: Deploy to VPS
    needs: ci-test # Hanya jalan jika tahap ci-test BERHASIL
    if: github.ref == 'refs/heads/main' # Hanya jalan di branch main
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH ke Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }} # IP Address server Anda
          username: ${{ secrets.VPS_USERNAME }} # Biasanya 'root' atau 'ubuntu'
          key: ${{ secrets.VPS_SSH_KEY }} # Private SSH Key Anda
          port: 22
          script: |
            echo "🔄 Masuk ke folder project..."
            cd /path/ke/folder/project/anda  # <--- GANTI DENGAN PATH ASLI DI SERVER

            echo "🔄 Pull kode terbaru dari GitHub..."
            git pull origin main

            echo "🔄 Build dan restart container production..."
            # Pastikan Anda sudah setup script ini di package.json server
            npm run docker:prod 

            echo "🔄 Bersihkan image docker lama untuk hemat space..."
            docker image prune -f

            echo "✅ Deployment berhasil!"
