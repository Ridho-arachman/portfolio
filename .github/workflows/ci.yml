name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-test:
    name: Lint, Typecheck, Build, Unit & Docker Test
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Run Linter
        run: npm run lint

      - name: 🧠 Type Checking
        run: npx tsc --noEmit

      - name: 🧪 Unit Tests
        run: npm run test:unit

      - name: 🏗️ Build Next.js App
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run build

      - name: 🐳 Test Docker Build (PENTING!)
        run: |
          echo "Membangun image Docker untuk validasi..."
          docker build -f docker/Dockerfile.prod -t nextjs-app:ci-test .
          echo "✅ Docker build berhasil! File .dockerignore dan Dockerfile aman."

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test
      BETTER_AUTH_SECRET: ci-integration-test-secret-1234567890abcdef
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🗄️ Push schema to test database
        run: npx prisma db push

      - name: 🧪 Integration Tests
        run: vitest run --config vitest.integration.config.ts

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test
      BETTER_AUTH_SECRET: ci-e2e-test-secret-1234567890abcdef
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Push schema to test database
        run: npx prisma db push

      - name: 🖥️ Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 End-to-End Tests
        run: npm run test:e2e
