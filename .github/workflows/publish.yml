name: Publish to npm

# Every push to main publishes a new patch version to npm, so the
# registry copy is always fresh. Requires repo secret NPM_TOKEN
# (npmjs.com -> Access Tokens -> publish permission).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Serialize publishes; never cancel a publish in flight (avoids
# duplicate-version races when pushes land close together).
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish next patch to npm
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository (with tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js with npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client (no DB needed)
        run: npx prisma generate

      - name: 🧠 Typecheck gate (do not publish broken code)
        run: npx tsc --noEmit

      # No commit is pushed to main (a bot commit would sit at the repo
      # HEAD, where GitHub never runs workflows — GITHUB_TOKEN pushes are
      # suppressed — making CI look absent). The version is derived from
      # the latest git tag instead, so every main commit stays human and
      # CI runs on all of them.
      - name: 🔢 Bump patch from latest tag, publish, push tag only
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v$(node -p "require('./package.json').version")")
          NEXT=$(echo "$LATEST" | sed 's/^v//' | awk -F. '{print $1"."$2"."$3+1}')
          npm version "$NEXT" --no-git-tag-version
          npm publish --access public
          git tag "v$NEXT"
          git push origin "v$NEXT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}