name: Publish to npm

# Every push to main publishes a new patch version to npm, so the
# registry copy is always fresh. Requires repo secret NPM_TOKEN
# (npmjs.com -> Access Tokens -> publish permission).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Serialize publishes; never cancel a publish in flight (avoids
# duplicate-version races when pushes land close together).
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # The version-bump commit this workflow pushes itself must not
    # trigger another publish (infinite loop guard).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Bump patch and publish
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js with npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: 🔧 Git identity for version commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client (no DB needed)
        run: npx prisma generate

      - name: 🧠 Typecheck gate (do not publish broken code)
        run: npx tsc --noEmit

      - name: 🔢 Bump patch version ([skip ci] avoids re-trigger)
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag "v$VERSION"

      - name: 🚀 Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🏷️ Push version commit and tag
        run: git push --follow-tags
